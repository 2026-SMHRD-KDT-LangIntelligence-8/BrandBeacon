<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout :: layout(~{::content})}">
<body>

<div th:fragment="content" class="content-wrapper" style="max-width: 1000px; margin: 0 auto; padding: 20px;">

    <h4 style="margin-bottom:5px; font-size:18px;">최종 생성 브랜드 무드보드 결과</h4>
    <p style="font-size:14px; color:var(--text-gray); margin-bottom:20px;">당신의 기획 데이터로 완성된 단 하나의 브랜드 무드보드 입니다.</p>

    <div style="display:grid; grid-template-columns: repeat(4, 1fr); gap:15px; min-height:280px; margin-bottom:25px;" id="live-moodboard-canvas">
        <!-- 💡 빈 캔버스: 자바스크립트가 여기에 8장의 이미지를 꽂아 넣습니다 -->
    </div>

        <!-- 💡 사용자가 브랜드 대시보드 확인하기 클릭시 입력데이터 전송-->
    <div style="display: flex; justify-content: flex-end; margin-top: 25px;">
        <button id="dashboard-btn" onclick="goToDashboard()" class="btn-action btn-blue">브랜드 대시보드 확인하기</button>
    </div>

    <script>
        async function goToDashboard() {
            const btn = document.getElementById('dashboard-btn');
            btn.textContent = 'AI 분석 중... (약 30초 소요)';
            btn.disabled = true;

            const finalMoodboardData = JSON.parse(sessionStorage.getItem("finalMoodboardData") || "[]");
            const userText = sessionStorage.getItem("brandQ1") || "";
            const selectedTags = JSON.parse(sessionStorage.getItem("brandKeywords") || "[]");

            const imageUrls = [];
            finalMoodboardData.forEach(cat => {
                cat.assets.forEach(url => {
                    if (url && url.startsWith('http')) imageUrls.push(url);
                });
            });

            try {
                const response = await fetch('/api/brand/analyze-full', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        user_text: userText,
                        selected_tags: selectedTags,
                        image_urls: imageUrls
                    })
                });
                if (!response.ok) throw new Error("분석 실패");
                const data = await response.json();
                sessionStorage.setItem("dashboardData", JSON.stringify(data));
                window.location.href = '/dashboard';
            } catch (error) {
                alert("분석 중 오류가 발생했습니다. 다시 시도해주세요.");
                btn.textContent = '브랜드 대시보드 확인하기';
                btn.disabled = false;
            }
        }
    </script>

    <!-- 💡 <th:block> 제거 및 스크립트 위치 이동 완료 -->
    <script th:src="@{/js/common.js}"></script>
    <script th:src="@{/js/dashboard.js}"></script>

    <!-- 💡 세션에 저장된 8장 사진 데이터를 꺼내서 화면에 그리는 핵심 로직 -->
    <script>
        window.addEventListener('DOMContentLoaded', () => {
            const canvas = document.getElementById('live-moodboard-canvas');
            const savedData = sessionStorage.getItem("finalMoodboardData");

            if (savedData && canvas) {
                const parsedData = JSON.parse(savedData);
                canvas.innerHTML = '';

                parsedData.forEach(cat => {
                    const assets = cat.assets; // 배열 형태의 이미지 리스트
                    const count = Math.min(assets.length, 4); // 최대 4개까지만 표시

                    // 1. 카테고리 전체 박스 (div)
                    const itemDiv = document.createElement('div');
                    itemDiv.style.borderRadius = '8px';
                    itemDiv.style.overflow = 'hidden';
                    itemDiv.style.position = 'relative';
                    itemDiv.style.height = '200px';
                    itemDiv.style.backgroundColor = '#262F40';
                    itemDiv.style.display = 'grid';

                    // 2. 이미지 개수에 따라 CSS Grid 분할 적용
                    itemDiv.classList.add(`layout-${count}`);

                    // 3. 이미지 동적 생성
                    assets.slice(0, 4).forEach((imgUrl, idx) => {
                        const imgContainer = document.createElement('div');
                        imgContainer.style.overflow = 'hidden';
                        imgContainer.className = `thumb-${idx}`;

                        if (imgUrl && imgUrl.startsWith('http')) {
                            imgContainer.innerHTML = `<img src="${imgUrl}" style="width:100%; height:100%; object-fit:cover; display:block;">`;
                        } else {
                            imgContainer.innerHTML = `<div style="display:flex; align-items:center; justify-content:center; height:100%; color:#fff; font-size:12px;">${imgUrl}</div>`;
                        }
                        itemDiv.appendChild(imgContainer);
                    });

                    // 4. 카테고리 라벨 추가 (이미지 레이아웃 위에 겹침 방지를 위해 별도 생성)
                    const label = document.createElement('div');
                    label.style.position = 'absolute'; label.style.bottom = '0'; label.style.left = '0'; label.style.right = '0';
                    label.style.background = 'rgba(0,0,0,0.7)'; label.style.color = '#fff';
                    label.style.padding = '5px'; label.style.fontSize = '11px'; label.style.textAlign = 'center';
                    label.innerText = cat.category;

                    itemDiv.appendChild(label);
                    canvas.appendChild(itemDiv);
                });
            }
        });
    </script>

</div>
</body>
</html>
