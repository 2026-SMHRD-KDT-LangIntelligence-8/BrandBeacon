<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout :: layout(~{::content})}">
<body>

<div th:fragment="content" class="content-wrapper" style="max-width: 1000px; margin: 0 auto; padding: 20px;">

    <h4 style="margin-bottom:5px; font-size:18px;">최종 생성 브랜드 무드보드 결과</h4>
    <p style="font-size:12px; color:var(--text-gray); margin-bottom:20px;">당신의 기획 데이터로 완성된 단 하나의 브랜드 무드보드 입니다.</p>

    <div style="display:grid; grid-template-columns: repeat(4, 1fr); gap:15px; min-height:280px; margin-bottom:25px;" id="live-moodboard-canvas">
        <!-- 💡 빈 캔버스: 자바스크립트가 여기에 8장의 이미지를 꽂아 넣습니다 -->
    </div>

    <div style="display:flex; justify-content:flex-end;">
        <a th:href="@{/dashboard}" class="btn-action btn-blue" style="text-decoration: none; display: inline-flex; align-items: center;">브랜드 대시보드 확인하기</a>
    </div>

    <!-- 💡 <th:block> 제거 및 스크립트 위치 이동 완료 -->
    <script th:src="@{/js/common.js}"></script>
    <script th:src="@{/js/dashboard.js}"></script>

    <!-- 💡 세션에 저장된 8장 사진 데이터를 꺼내서 화면에 그리는 핵심 로직 -->
    <script>
        window.addEventListener('DOMContentLoaded', () => {
            const canvas = document.getElementById('live-moodboard-canvas');
            const savedData = sessionStorage.getItem("finalMoodboardData");

            if (savedData && canvas) {
                const parsedData = JSON.parse(savedData);
                canvas.innerHTML = ''; // 로딩 중 찌꺼기가 있다면 초기화

                // 저장된 8개 카테고리를 순회하면서 네모 상자(div)를 만들어 캔버스에 추가합니다.
                parsedData.forEach(cat => {
                    const imgUrl = cat.assets[0]; // 카테고리당 첫 번째 선택 이미지

                    const itemDiv = document.createElement('div');
                    itemDiv.style.backgroundColor = '#262F40';
                    itemDiv.style.borderRadius = '8px';
                    itemDiv.style.overflow = 'hidden';
                    itemDiv.style.position = 'relative';
                    itemDiv.style.height = '200px';

                    // 이미지 주소가 있으면 렌더링, 텍스트(예: 색상코드)면 텍스트 렌더링
                    if (imgUrl && imgUrl.startsWith('http')) {
                        itemDiv.innerHTML = `
                            <img src="${imgUrl}" style="width:100%; height:100%; object-fit:cover; display:block;">
                            <div style="position:absolute; bottom:0; left:0; right:0; background:rgba(0,0,0,0.7); color:#fff; padding:8px; font-size:12px; text-align:center; font-weight:bold;">${cat.category}</div>
                        `;
                    } else {
                        itemDiv.innerHTML = `
                            <div style="width:100%; height:100%; display:flex; align-items:center; justify-content:center; padding:10px; text-align:center; color:#fff; font-size:14px; font-weight:bold;">${imgUrl || cat.category}</div>
                            <div style="position:absolute; bottom:0; left:0; right:0; background:rgba(0,0,0,0.7); color:#fff; padding:8px; font-size:12px; text-align:center; font-weight:bold;">${cat.category}</div>
                        `;
                    }
                    canvas.appendChild(itemDiv);
                });
            } else {
                // 데이터를 못 불러왔을 때 띄우는 메시지
                canvas.innerHTML = '<div style="grid-column: span 4; text-align:center; padding: 50px; color: var(--text-gray);">선택된 레퍼런스 이미지가 없습니다. 이전 단계로 돌아가 이미지를 선택해주세요.</div>';
            }
        });
    </script>

</div>
</body>
</html>
