<div xmlns:th="http://www.thymeleaf.org">

    <div th:fragment="content" class="content-wrapper" style="max-width: 1000px; margin: 0 auto; padding: 20px;">

        <h4 style="margin-bottom:5px; font-size:18px;">최종 생성 브랜드 무드보드 결과</h4>
        <p style="font-size:12px; color:var(--text-gray); margin-bottom:20px;">당신의 기획 데이터로 완성된 단 하나의 브랜드 무드보드 입니다.</p>

        <div style="display:grid; grid-template-columns: repeat(4, 1fr); gap:15px; min-height:280px; margin-bottom:25px;" id="live-moodboard-canvas">
        </div>

        <div style="display:flex; justify-content:flex-end;">
            <button class="btn-action btn-blue" onclick="showLiveDashboard()">브랜드 대시보드 확인하기</button>
        </div>

    </div>

    <th:block th:fragment="page-scripts">
        <script th:src="@{/js/dashboard.js}"></script>
    </th:block>

</div>
