<div xmlns:th="http://www.thymeleaf.org">

    <div th:fragment="content" class="content-wrapper" style="max-width: 1000px; margin: 0 auto; padding: 20px;">

        <div class="dash-header-title">
            <h2>Brand Kit Dashboard</h2>
            <p>의사결정을 지원하는 브랜드의 시각화 최종 종합 분석 리포트입니다.</p>
        </div>

        <div style="display: flex; justify-content: flex-end; gap: 12px; margin-bottom: 25px;">
            <button class="btn-action" style="background:transparent; color:var(--text-light);" onclick="exportToPDF()">PDF로 내보내기</button>
            <button class="btn-action btn-orange" onclick="openSaveProjectModal()">프로젝트 저장</button>
        </div>

        <div style="display:grid; grid-template-columns: 1fr 1fr 1.2fr; gap:20px; margin-bottom:25px;">

            <div class="minimal-section" style="cursor:pointer;" onclick="navigateTo(6)">
                <div class="section-box-title" style="margin-bottom:15px;">
                    섹션 1. 브랜드 방향 키워드
                    <span style="font-size:11px; color:var(--primary-blue); font-weight:normal; float:right;">[클릭 시 6번 화면 이동]</span>
                </div>
                <div id="brand-keyword-container" style="display:flex; gap:8px; flex-wrap:wrap;"></div>
            </div>

            <div class="minimal-section">
                <div class="section-box-title" style="margin-bottom:15px;">섹션 2. 브랜드 일관성 점수</div>
                <div style="display:flex; justify-content:center; align-items:center; min-height:100px;">
                    <div class="progress-circle"></div>
                </div>
            </div>

            <div class="minimal-section">
                <div class="section-box-title" style="margin-bottom:15px;">섹션 3. 매칭 벤치마크 톱 3</div>
                <div id="benchmark-list" style="display:flex; flex-direction:column; gap:10px;"></div>
            </div>

            <div class="minimal-section" style="grid-column: span 2;">
                <div class="section-box-title" style="margin-bottom: 15px;">섹션 4. 최종 마켓 포지션 맵</div>
                <div class="positioning-map-canvas">
                    <div class="axis-x-line"></div><div class="axis-y-line"></div>
                    <div class="axis-label" style="top:4px; left:50%; transform:translateX(-50%);">active</div>
                    <div class="axis-label" style="bottom:4px; left:50%; transform:translateX(-50%);">calm</div>
                    <div class="axis-label" style="top:50%; left:4px; transform:translateY(-50%);">performance</div>
                    <div class="axis-label" style="top:50%; right:4px; transform:translateY(-50%);">lifestyle</div>

                    <div class="brand-dot" style="top:40%; left:20%;">Nike</div>
                    <div class="brand-dot" style="top:30%; left:60%;">HOKA</div>
                    <div class="brand-dot" style="top:42%; left:75%;">On</div>
                    <div class="brand-dot our-brand-dot" style="top:50%; left:65%;">● 도심 코어</div>
                </div>
            </div>

            <div class="minimal-section">
                <div class="section-box-title" style="margin-bottom: 15px;">섹션 5. 방향성 가이드 인사이트</div>
                <ul class="insight-list" style="padding-left: 20px;">
                    <li class="insight-item"><span class="insight-icon">✦</span><div>현재 가치 벡터는 글로벌 <strong>On(온 러닝)</strong> 세그먼트에 근접 매칭됩니다.</div></li>
                </ul>
            </div>
        </div>

        <div class="minimal-section" style="margin-bottom:25px;">
            <div class="section-box-title" style="margin-bottom: 15px;">섹션 6. 최종 무드보드 결과물</div>
            <div style="display:grid; grid-template-columns: repeat(4, 1fr); gap:15px; min-height:200px;" id="dashboard-inline-moodboard-canvas"></div>
        </div>

        <button class="btn-action btn-orange" style="width:100%; justify-content:center;" onclick="rebootProjectWorkflow()">처음부터 다시 기획하기</button>

        <div class="save-modal-overlay" id="custom-save-modal-overlay">
            <div class="save-modal-box">
                <h3 style="margin-bottom:15px; font-size:18px; color:var(--primary-orange);">프로젝트 저장</h3>

                <div class="input-group">
                    <label>저장할 프로젝트명</label>
                    <input type="text" id="modal-project-title-input" value="신규 생성 매칭 가이드 모델 셋">
                </div>

                <div class="input-group">
                    <label>보관할 기존 폴더 선택</label>
                    <select id="modal-existing-folder-select"></select>
                </div>

                <div class="input-group">
                    <label style="color:var(--primary-blue)">새 폴더 생성하여 저장</label>
                    <input type="text" id="modal-new-folder-input" placeholder="생성할 새 폴더명을 입력하세요">
                </div>

                <div style="display:flex; justify-content:flex-end; gap:10px; margin-top:25px;">
                    <button class="btn-action" onclick="closeSaveProjectModal()">취소</button>
                    <button class="btn-action btn-orange" onclick="executeAdvancedProjectSave()">프로젝트 저장</button>
                </div>
            </div>
        </div>

    </div>

    <th:block th:fragment="page-scripts">
        <script th:src="@{/js/dashboard.js}"></script>
    </th:block>

</div>
