<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout :: layout(~{::content})}">
<body>
<div th:fragment="content">
    <div style="position: relative; bottom: 80px; left: 40px; max-width: 800px; padding-right: 20px; margin-top: 50px;">
        <h2 style="font-size: 55px; font-weight: 800; color: #111; margin-bottom: 12px; letter-spacing: -1px;">
            BRAND BEACON
        </h2>

        <h3 style="font-size: 27px; font-weight: 700; color: #333; margin-bottom: 25px;">
            영감이 브랜드 아이덴티티로 완성되는 곳
        </h3>

        <p style="color: #666; font-size: 18px; line-height: 1.8;">
            BRAND BEACON은 창업자의 머릿속에 머물러 있는 희미한 영감을 시장에서 가장 설득력 있는 시각 언어로 구체화하는 브랜드 빌더입니다. <br>
            우리는 단순한 이미지 검색 도구가 아니라, 브랜드가 나아가야 할 방향을 함께 설계하는 '시각적 기획 파트너'를 지향합니다.
        </p>
    </div>
</div>
</body>
</html>
