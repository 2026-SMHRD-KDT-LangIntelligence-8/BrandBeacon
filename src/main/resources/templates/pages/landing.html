<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout :: layout(~{::content})}">
<body>
<div th:fragment="content" class="content-wrapper" style="max-width: 1200px; margin: 0 auto; padding: 20px;">

    <div class="split-layout" style="display: flex; align-items: center; gap: 50px; min-height: 60vh;">
        <div class="split-left">
            <h2 style="font-size: 40px; line-height:1.4; margin-bottom: 20px; color:var(--text-white)">
                추상적인 브랜드 컨셉을<br>시각언어로 동기화하다
            </h2>
            <p style="color: var(--text-gray); margin-bottom: 30px; line-height: 1.6; font-size: 18px;">
                도시형 러너와 고프코어 브랜드를 위한 지능형 디렉트 툴.<br>아이디어를 입력하고 즉시 포지셔닝 맵을 확인하세요.
            </p>
            <button class="btn-action btn-orange" style="border-radius: 25px; padding: 14px 35px;" onclick="handleEntrance()">
                프로젝트 만들기
            </button>
        </div>

        <div class="split-right" style="display: flex; gap: 20px; flex: 1; overflow: hidden; height: 650px;">

            <!-- 왼쪽: 무드보드 (위로 이동) -->
            <div class="showcase-container">
                <div class="showcase-track-up">
                    <div class="showcase-card moodboard-card"><img th:src="@{/images/landing/moodboard_sample1.png}" style="object-fit: contain; background-color: #f0f0f0;"></div>
                    <div class="showcase-card moodboard-card"><img th:src="@{/images/landing/moodboard_sample2.png}" style="object-fit: contain; background-color: #f0f0f0;"></div>
                    <div class="showcase-card moodboard-card"><img th:src="@{/images/landing/moodboard_sample3.png}" style="object-fit: contain; background-color: #f0f0f0;"></div>
                    <div class="showcase-card moodboard-card"><img th:src="@{/images/landing/moodboard_sample4.png}" style="object-fit: contain; background-color: #f0f0f0;"></div>
                    <div class="showcase-card moodboard-card"><img th:src="@{/images/landing/moodboard_sample5.png}" style="object-fit: contain; background-color: #f0f0f0;"></div>
                    <div class="showcase-card moodboard-card"><img th:src="@{/images/landing/moodboard_sample1.png}" style="object-fit: contain; background-color: #f0f0f0;"></div>
                    <div class="showcase-card moodboard-card"><img th:src="@{/images/landing/moodboard_sample2.png}" style="object-fit: contain; background-color: #f0f0f0;"></div>
                    <div class="showcase-card moodboard-card"><img th:src="@{/images/landing/moodboard_sample3.png}" style="object-fit: contain; background-color: #f0f0f0;"></div>
                    <div class="showcase-card moodboard-card"><img th:src="@{/images/landing/moodboard_sample4.png}" style="object-fit: contain; background-color: #f0f0f0;"></div>
                    <div class="showcase-card moodboard-card"><img th:src="@{/images/landing/moodboard_sample5.png}" style="object-fit: contain; background-color: #f0f0f0;"></div>
                </div>
            </div>

            <!-- 오른쪽: 대시보드 (아래로 이동) -->
            <div class="showcase-container">
                <div class="showcase-track-down">
                    <div class="showcase-card dashboard-card"><img th:src="@{/images/landing/dashboard_sample1.png}" style="object-fit: cover; object-position: top;"></div>
                    <div class="showcase-card dashboard-card"><img th:src="@{/images/landing/dashboard_sample2.png}" style="object-fit: cover; object-position: top;"></div>
                    <div class="showcase-card dashboard-card"><img th:src="@{/images/landing/dashboard_sample3.png}" style="object-fit: cover; object-position: top;"></div> <!-- 루프용 -->
                    <div class="showcase-card dashboard-card"><img th:src="@{/images/landing/dashboard_sample1.png}" style="object-fit: cover; object-position: top;"></div>
                    <div class="showcase-card dashboard-card"><img th:src="@{/images/landing/dashboard_sample2.png}" style="object-fit: cover; object-position: top;"></div>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
